name: MCP Server FastMCP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker image
      run: |
        IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/fastmcp-server
        TIMESTAMP=$(date +%s)

        # Build image with tags
        docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:$TIMESTAMP-v1 .

        # Push both tags
        docker push $IMAGE_NAME:latest
        docker push $IMAGE_NAME:$TIMESTAMP-v1
